<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <title>Трекер малышки Cloud</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f472b6;
      --accent-soft: rgba(244, 114, 182, 0.15);
      --mint: #34d399;
      --mint-soft: rgba(52, 211, 153, 0.15);
      --border: #334155;
      --danger: #fb7185;
    }
    [data-theme="light"] {
      --bg: #fdf2f8;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #db2777;
      --accent-soft: #fce7f3;
      --mint: #059669;
      --mint-soft: #d1fae5;
      --border: #e2e8f0;
      --danger: #e11d48;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      padding-bottom: 110px;
      max-width: 500px;
      margin: 0 auto;
    }
    button, .chip, select, input { touch-action: manipulation; user-select: none; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 4px;
    }
    .title-wrap h1 { font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .age-badge { font-size: 0.78rem; color: var(--accent); font-weight: 600; margin-top: 2px; }
    .header-actions { display: flex; gap: 6px; align-items: center; }
    .icon-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      height: 40px;
      padding: 0 11px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      display: inline-block;
    }
    .sync-dot.online { background: var(--mint); box-shadow: 0 0 8px var(--mint); }
    .sync-dot.busy { background: #fbbf24; }
    .sync-dot.err { background: var(--danger); }

    .sync-drawer {
      display: none;
      background: var(--card);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .sync-drawer.open { display: block; }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--card);
      padding: 6px;
      border-radius: 16px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
      position: sticky;
      top: 8px;
      z-index: 9999;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }
    .tab-btn {
      padding: 11px 4px;
      background: transparent;
      border: none;
      border-radius: 11px;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--accent); color: #fff; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.98rem;
      font-weight: 600;
      user-select: text;
    }
    .stat-box {
      background: var(--accent-soft);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
    }
    .stat-box.mint { background: var(--mint-soft); }
    .stat-val { font-size: 1.45rem; font-weight: 800; color: var(--accent); }
    .stat-box.mint .stat-val { color: var(--mint); }
    .stat-lbl { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    .formula-hint { font-size: 0.78rem; color: var(--muted); margin-top: 8px; line-height: 1.35; }
    .scoop-box {
      margin-top: 10px;
      padding: 10px 12px;
      background: var(--bg);
      border-radius: 12px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .timer-display {
      font-size: 1.7rem;
      font-weight: 800;
      text-align: center;
      margin: 6px 0;
      color: var(--mint);
    }
    .btn-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .btn {
      flex: 1;
      min-height: 44px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      padding: 8px 10px;
    }
    .btn-sm {
      min-height: 36px;
      font-size: 0.8rem;
      padding: 6px 8px;
    }
    .btn:active { opacity: 0.7; transform: scale(0.97); }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      width: 100%;
      margin-top: 12px;
      font-size: 1rem;
      min-height: 50px;
    }
    .chip {
      padding: 8px 12px;
      border-radius: 99px;
      font-size: 0.8rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
    }
    .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .log-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .log-item:last-child { border-bottom: none; }
    .time-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg);
      border: 1px dashed var(--border);
      padding: 4px 8px;
      border-radius: 8px;
      font-weight: 800;
      color: var(--text);
      cursor: pointer;
      margin-right: 4px;
    }
    .time-badge:active { border-color: var(--accent); color: var(--accent); }
    .del-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 1.1rem;
      padding: 6px 10px;
      cursor: pointer;
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .check-row input { width: 22px; height: 22px; }
    .time-box {
      margin-top: 10px;
      padding: 10px;
      background: rgba(15, 23, 42, 0.35);
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    [data-theme="light"] .time-box {
      background: #f8fafc;
    }
  </style>
</head>
<body>

  <div id="appRoot">
    <header>
      <div class="title-wrap">
        <h1>🍼 Трекер малышки</h1>
        <div class="age-badge" id="ageBadge">Возраст: укажите дату во вкладке «Нормы»</div>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="syncToggleBtn">
          <span class="sync-dot" id="syncDot"></span>
          <span id="syncBtnText">Облако</span>
        </button>
        <button type="button" class="icon-btn" id="themeBtn">🌙</button>
      </div>
    </header>

    <!-- ПАНЕЛЬ НАСТРОЙКИ ОБЛАЧНОЙ СИНХРОНИЗАЦИИ -->
    <div class="sync-drawer" id="syncDrawer">
      <div class="card-title">
        <span>☁️ Синхронизация (Папа + Мама)</span>
        <span id="syncStatusText" style="color:var(--mint); text-transform:none;">Не подключено</span>
      </div>
      <label>Кто отмечает с этого телефона:</label>
      <div class="grid-2" style="margin-bottom:8px;">
        <button type="button" class="btn" id="rolePapa">👨 Папа</button>
        <button type="button" class="btn" id="roleMama">👩 Мама</button>
      </div>
      <label>Общий код семьи (одинаковый для обоих телефонов):</label>
      <input type="text" id="syncCodeInput" placeholder="Нажми «Создать облако» или вставь код">
      <div class="btn-row">
        <button type="button" class="btn" id="btnCreateCloud" style="border-color:var(--mint);color:var(--mint);">✨ Создать облако</button>
        <button type="button" class="btn" id="btnConnectCloud" style="border-color:var(--accent);color:var(--accent);">🔗 Подключить</button>
        <button type="button" class="btn" id="btnPullNow">🔄 Обновить</button>
      </div>
      <div style="font-size:0.74rem; color:var(--muted); margin-top:8px; line-height:1.35;">
        💡 Один создаёт облако и отправляет код второму в Telegram. Записи обоих телефонов объединяются автоматически.
      </div>
    </div>

    <!-- ВКЛАДКИ -->
    <nav class="tabs">
      <button type="button" class="tab-btn active" data-tab="feed">🍼 Кормление</
